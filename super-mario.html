<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mariio Bros - Meu Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 min-h-screen flex flex-col font-sans overflow-hidden select-none">

    <!-- Barra Superior -->
    <header class="bg-gray-900/85 backdrop-blur-md border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
            <a href="index.html" class="flex items-center text-gray-300 hover:text-red-500 transition-colors font-medium text-sm">
                <i class="fa-solid fa-arrow-left mr-2"></i> Voltar ao Início
            </a>
            <div class="flex items-center space-x-3">
                <button id="themeToggleBtn" class="p-2 rounded-full text-gray-300 hover:bg-gray-800 transition-colors cursor-pointer">
                    <i id="themeIcon" class="fa-solid fa-sun text-xl"></i>
                </button>
                <span class="text-sm font-semibold text-gray-200">Super Mariio Bros</span>
            </div>
        </div>
    </header>

    <!-- Área do Jogo Ajustada -->
    <main class="flex-1 w-full h-[calc(100vh-4rem)] flex flex-col items-center justify-between p-2 relative">
        
        <!-- Placar Flutuante -->
        <div class="absolute top-3 left-1/2 transform -translate-x-1/2 z-10 bg-gray-900/90 backdrop-blur-md px-5 py-2 rounded-2xl border border-gray-800 shadow-xl flex items-center gap-4 text-white text-xs sm:text-sm pointer-events-none">
            <div class="flex items-center gap-1 font-bold text-red-500">
                <i class="fa-solid fa-m"></i> <span class="hidden sm:inline">Super Mario</span>
            </div>
            <div>Moedas: <span id="score" class="text-yellow-400 font-bold">0</span></div>
        </div>

        <!-- Canvas Proporcional e Sem Esticar -->
        <div class="relative w-full flex-1 flex items-center justify-center my-auto px-2">
            <canvas id="gameCanvas" width="800" height="380" class="bg-sky-400 rounded-2xl shadow-2xl border border-gray-800 w-full max-w-4xl h-[65vh] sm:h-auto object-contain"></canvas>
            
            <!-- Overlay de Início / Game Over -->
            <div id="gameOverlay" class="absolute inset-0 bg-black/85 backdrop-blur-sm flex flex-col items-center justify-center text-white z-30 rounded-2xl m-2">
                <h2 id="overlayTitle" class="text-2xl sm:text-3xl font-extrabold mb-3 tracking-wide text-center">Super Mariio Bros</h2>
                <p id="overlayText" class="text-xs sm:text-sm text-gray-300 mb-6 max-w-sm text-center px-4">Colete moedas e desvie dos abismos nas plataformas!</p>
                <button id="startBtn" class="px-8 py-3.5 bg-red-600 hover:bg-red-700 active:bg-red-800 text-white font-bold rounded-xl shadow-2xl transition-all transform hover:scale-105 cursor-pointer z-45 pointer-events-auto">
                    Iniciar Jogo
                </button>
            </div>
        </div>

        <!-- Controles Touch Grandes e Confortáveis para Celular -->
        <div id="mobileControls" class="w-full max-w-lg hidden items-center justify-between px-6 pb-4 z-10">
            <!-- Direcional (Esquerda, Direita maiores) -->
            <div class="flex gap-4">
                <button id="btnLeft" class="w-20 h-20 bg-gray-800/90 active:bg-red-600 text-white rounded-2xl flex items-center justify-center text-2xl transition-colors border border-gray-700 shadow-xl">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <button id="btnRight" class="w-20 h-20 bg-gray-800/90 active:bg-red-600 text-white rounded-2xl flex items-center justify-center text-2xl transition-colors border border-gray-700 shadow-xl">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <!-- Botão de Pulo Grande -->
            <div class="flex items-center justify-center">
                <button id="btnJump" class="w-24 h-24 bg-red-600/95 active:bg-red-500 hover:bg-red-600 border-2 border-red-400 text-white rounded-full shadow-2xl flex flex-col items-center justify-center font-bold tracking-wider transition-all transform active:scale-95">
                    <i class="fa-solid fa-arrow-up text-xl mb-1"></i>
                    <span class="text-xs">PULAR</span>
                </button>
            </div>
        </div>
    </main>

    <script>
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;
        if (htmlElement.classList.contains('dark')) themeIcon.classList.replace('fa-sun', 'fa-moon');
        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            localStorage.setItem('theme', htmlElement.classList.contains('dark') ? 'dark' : 'light');
            themeIcon.classList.toggle('fa-sun'); themeIcon.classList.toggle('fa-moon');
        });

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('gameOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayText = document.getElementById('overlayText');
        const startBtn = document.getElementById('startBtn');
        const mobileControls = document.getElementById('mobileControls');

        let score = 0, isPlaying = false, animId;
        let mario = { x: 50, y: 280, width: 22, height: 28, dx: 0, dy: 0, gravity: 0.5, jumpPower: -10, grounded: false };
        
        let platforms = [
            { x: 0, y: 330, width: 320, height: 50 },
            { x: 380, y: 330, width: 220, height: 50 },
            { x: 640, y: 330, width: 160, height: 50 },
            { x: 180, y: 230, width: 120, height: 16 },
            { x: 380, y: 170, width: 130, height: 16 },
            { x: 580, y: 220, width: 110, height: 16 }
        ];
        
        let coins = [
            { x: 230, y: 190, collected: false }, 
            { x: 440, y: 130, collected: false },
            { x: 635, y: 180, collected: false }
        ];

        function pular() {
            if (isPlaying && mario.grounded) {
                mario.dy = mario.jumpPower;
                mario.grounded = false;
            }
        }

        async function startGame() {
            // Tenta forçar a tela cheia e a orientação horizontal (Paisagem) no celular
            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (err) {
                // Alguns navegadores móveis bloqueiam sem interação profunda do usuário ou permissão total, mas tentamos o melhor esforço
                console.log("Orientação ou Fullscreen não suportados/bloqueados pelo navegador: ", err);
            }

            score = 0; scoreEl.textContent = score;
            mario.x = 50; mario.y = 280; mario.dy = 0; mario.dx = 0;
            coins.forEach(c => c.collected = false);
            overlay.classList.add('hidden');

            const isMobileDevice = window.innerWidth <= 768 || 'ontouchstart' in window;
            if (isMobileDevice) {
                mobileControls.classList.remove('hidden');
                mobileControls.classList.add('flex');
            } else {
                mobileControls.classList.add('hidden');
                mobileControls.classList.remove('flex');
            }

            isPlaying = true;
            loop();
        }

        function loop() {
            if (!isPlaying) return;
            ctx.fillStyle = '#38BDF8'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            mario.dy += mario.gravity;
            mario.y += mario.dy;
            mario.x += mario.dx;

            if (mario.x < 0) mario.x = 0;
            if (mario.x + mario.width > canvas.width) mario.x = canvas.width - mario.width;

            mario.grounded = false;
            platforms.forEach(p => {
                if (mario.x < p.x + p.width && mario.x + mario.width > p.x &&
                    mario.y + mario.height >= p.y && mario.y + mario.height <= p.y + p.height + 10 && mario.dy >= 0) {
                    mario.y = p.y - mario.height;
                    mario.dy = 0;
                    mario.grounded = true;
                }
            });

            ctx.fillStyle = '#15803D';
            platforms.forEach(p => ctx.fillRect(p.x, p.y, p.width, p.height));

            coins.forEach(c => {
                if (!c.collected) {
                    ctx.fillStyle = '#FACC15';
                    ctx.beginPath(); ctx.arc(c.x, c.y, 9, 0, Math.PI * 2); ctx.fill();
                    if (mario.x < c.x + 10 && mario.x + mario.width > c.x - 10 && mario.y < c.y + 10 && mario.y + mario.height > c.y - 10) {
                        c.collected = true; score += 1; scoreEl.textContent = score;
                    }
                }
            });

            ctx.fillStyle = '#EF4444'; ctx.fillRect(mario.x, mario.y, mario.width, mario.height);

            if (mario.y > canvas.height) {
                isPlaying = false;
                mobileControls.classList.add('hidden');
                mobileControls.classList.remove('flex');
                overlayTitle.textContent = "Game Over!";
                overlayText.textContent = `Você caiu no abismo! Moedas: ${score}`;
                startBtn.textContent = "Jogar Novamente";
                overlay.classList.remove('hidden');
            } else {
                animId = requestAnimationFrame(loop);
            }
        }

        window.addEventListener('keydown', e => {
            if (!isPlaying) return;
            if (e.key === 'ArrowLeft') mario.dx = -4;
            if (e.key === 'ArrowRight') mario.dx = 4;
            if (e.key === ' ') {
                e.preventDefault();
                pular();
            }
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' && mario.dx < 0) mario.dx = 0;
            if (e.key === 'ArrowRight' && mario.dx > 0) mario.dx = 0;
        });

        function setupPointerButton(id, onDown, onUp) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('pointerdown', (e) => { e.preventDefault(); onDown(); });
            el.addEventListener('pointerup', (e) => { e.preventDefault(); onUp(); });
            el.addEventListener('pointerleave', (e) => { e.preventDefault(); onUp(); });
        }

        setupPointerButton('btnLeft', () => mario.dx = -4, () => { if(mario.dx < 0) mario.dx = 0; });
        setupPointerButton('btnRight', () => mario.dx = 4, () => { if(mario.dx > 0) mario.dx = 0; });

        document.getElementById('btnJump').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            pular();
        });

        const triggerStart = (e) => {
            e.preventDefault();
            startGame();
        };

        startBtn.addEventListener('click', triggerStart);
        startBtn.addEventListener('touchstart', triggerStart, { passive: false });
    </script>
</body>
</html>
