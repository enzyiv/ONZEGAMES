<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mariio Bros - Meu Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #rotateWarning {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        @media screen and (max-width: 768px) and (orientation: portrait) {
            #rotateWarning {
                display: flex;
            }
        }
    </style>
</head>
<body class="bg-gray-950 h-screen flex flex-col font-sans overflow-hidden select-none">

    <!-- Aviso para virar o celular -->
    <div id="rotateWarning" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-mobile-screen-button text-5xl mb-4 animate-bounce text-red-500"></i>
        <h2 class="text-xl font-bold mb-2">Por favor, vire o celular!</h2>
        <p class="text-sm text-gray-300 max-w-xs">Este jogo foi feito para ser jogado com o celular na horizontal (paisagem).</p>
    </div>

    <!-- Barra Superior -->
    <header class="bg-gray-900/85 backdrop-blur-md border-b border-gray-800 shrink-0 z-50">
        <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-10">
            <a href="index.html" class="flex items-center text-gray-300 hover:text-red-500 transition-colors font-medium text-xs">
                <i class="fa-solid fa-arrow-left mr-1.5"></i> Voltar
            </a>
            <div class="flex items-center space-x-2">
                <button id="themeToggleBtn" class="p-1 rounded-full text-gray-300 hover:bg-gray-800 transition-colors cursor-pointer">
                    <i id="themeIcon" class="fa-solid fa-sun text-sm"></i>
                </button>
                <span class="text-xs font-semibold text-gray-200">Super Mariio Bros</span>
            </div>
        </div>
    </header>

    <!-- Área Geral do Jogo Envolvida para Tela Cheia Global -->
    <div id="gameWrapper" class="w-full flex-1 flex flex-col bg-gray-950 overflow-hidden">
        
        <!-- Placar, Fase e Botão de Tela Cheia -->
        <div class="w-full max-w-3xl mx-auto flex items-center justify-between px-2 pt-2 z-20">
            <div class="bg-gray-900/90 backdrop-blur-md px-2.5 py-1 rounded-lg border border-gray-800 shadow-md flex items-center gap-3 text-white text-[11px]">
                <div class="flex items-center gap-1 font-bold text-red-500">
                    <i class="fa-solid fa-m"></i> <span>Mario</span>
                </div>
                <div>Fase: <span id="levelIndicator" class="text-green-400 font-bold">1</span></div>
                <div>Moedas: <span id="score" class="text-yellow-400 font-bold">0</span></div>
            </div>

            <!-- Botão de Tela Cheia Otimizado para Mobile -->
            <button id="fullscreenBtn" class="bg-gray-800/90 hover:bg-gray-700 active:bg-gray-700 text-white px-2.5 py-1.5 rounded-lg shadow-md backdrop-blur-md border border-gray-700 transition-all cursor-pointer flex items-center gap-1 text-[11px] font-medium select-none">
                <i id="fullscreenIcon" class="fa-solid fa-expand"></i> <span class="hidden sm:inline">Tela Cheia</span>
            </button>
        </div>

        <!-- Canvas do Jogo -->
        <main class="w-full flex-1 flex items-center justify-center my-0.5 px-1 relative">
            <canvas id="gameCanvas" width="800" height="380" class="bg-sky-400 rounded-lg shadow-xl border border-gray-800 max-w-full h-[40vh] sm:h-[58vh] object-contain"></canvas>
            
            <!-- Overlay de Início / Game Over / Vitória de Fase -->
            <div id="gameOverlay" class="absolute inset-0 bg-black/85 backdrop-blur-sm flex flex-col items-center justify-center text-white z-30 rounded-lg m-1">
                <h2 id="overlayTitle" class="text-lg sm:text-2xl font-extrabold mb-1 tracking-wide text-center">Super Mariio Bros</h2>
                <p id="overlayText" class="text-[10px] sm:text-xs text-gray-300 mb-2 max-w-sm text-center px-4">Chegue até a bandeira para passar de fase!</p>
                <button id="startBtn" class="px-4 py-1.5 bg-red-600 hover:bg-red-700 active:bg-red-800 text-white font-bold rounded-lg shadow-xl transition-all cursor-pointer z-40 text-xs">
                    Iniciar Jogo
                </button>
            </div>
        </main>

        <!-- Controles Touch Compactos e Perfeitamente Ajustados -->
        <div id="mobileControls" class="w-full max-w-3xl mx-auto hidden items-center justify-between px-3 pb-2 z-10 shrink-0">
            <div class="flex gap-2">
                <button id="btnLeft" class="w-12 h-12 bg-gray-800/90 active:bg-red-600 text-white rounded-xl flex items-center justify-center text-sm border border-gray-700 shadow-md">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <button id="btnRight" class="w-12 h-12 bg-gray-800/90 active:bg-red-600 text-white rounded-xl flex items-center justify-center text-sm border border-gray-700 shadow-md">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
            <div class="flex items-center justify-center">
                <button id="btnJump" class="w-13 h-13 bg-red-600/95 active:bg-red-500 border border-red-400 text-white rounded-full shadow-md flex flex-col items-center justify-center font-bold tracking-wider px-3 py-2">
                    <i class="fa-solid fa-arrow-up text-xs mb-0.5"></i>
                    <span class="text-[7px]">PULAR</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;
        if (htmlElement.classList.contains('dark')) themeIcon.classList.replace('fa-sun', 'fa-moon');
        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            localStorage.setItem('theme', htmlElement.classList.contains('dark') ? 'dark' : 'light');
            themeIcon.classList.toggle('fa-sun'); themeIcon.classList.toggle('fa-moon');
        });

        // Gerenciamento Robusto de Tela Cheia
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const gameWrapper = document.getElementById('gameWrapper');

        fullscreenBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const doc = document;
            const isFullscreen = doc.fullscreenElement || doc.webkitFullscreenElement || doc.msFullscreenElement;

            if (!isFullscreen) {
                const requestMethod = gameWrapper.requestFullscreen || gameWrapper.webkitRequestFullscreen || gameWrapper.msRequestFullscreen;
                if (requestMethod) {
                    requestMethod.call(gameWrapper).catch(err => console.log(err));
                }
            } else {
                const exitMethod = doc.exitFullscreen || doc.webkitExitFullscreen || doc.msExitFullscreen;
                if (exitMethod) {
                    exitMethod.call(doc).catch(err => console.log(err));
                }
            }
        });

        function updateFullscreenIcon() {
            const isFull = document.documentElement.fullscreenElement || document.fullscreenElement || document.webkitFullscreenElement;
            if (isFull) {
                fullscreenIcon.classList.replace('fa-expand', 'fa-compress');
                fullscreenBtn.querySelector('span').textContent = 'Restaurar';
            } else {
                fullscreenIcon.classList.replace('fa-compress', 'fa-expand');
                fullscreenBtn.querySelector('span').textContent = 'Tela Cheia';
            }
        }

        document.addEventListener('fullscreenchange', updateFullscreenIcon);
        document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const levelIndicator = document.getElementById('levelIndicator');
        const overlay = document.getElementById('gameOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayText = document.getElementById('overlayText');
        const startBtn = document.getElementById('startBtn');
        const mobileControls = document.getElementById('mobileControls');

        let score = 0, currentLevel = 0, isPlaying = false, animId, gameState = 'START'; 
        // gameState pode ser: 'START', 'PLAYING', 'LEVEL_COMPLETE', 'GAME_OVER', 'VICTORY'

        let mario = { x: 50, y: 280, width: 22, height: 28, dx: 0, dy: 0, gravity: 0.5, jumpPower: -10, grounded: false };

        // BANCO DE FASES COM AS BANDEIRAS DE FINAL DE FASE
        const levels = [
            {
                platforms: [
                    { x: 0, y: 330, width: 320, height: 50 },
                    { x: 380, y: 330, width: 220, height: 50 },
                    { x: 640, y: 330, width: 160, height: 50 },
                    { x: 180, y: 230, width: 120, height: 16 },
                    { x: 380, y: 170, width: 130, height: 16 },
                    { x: 580, y: 220, width: 110, height: 16 }
                ],
                coins: [
                    { x: 230, y: 190, collected: false },
                    { x: 440, y: 130, collected: false },
                    { x: 635, y: 180, collected: false }
                ],
                flag: { x: 740, y: 260, width: 12, height: 70 } // Posição da bandeira na fase 1
            },
            {
                platforms: [
                    { x: 0, y: 330, width: 200, height: 50 },
                    { x: 280, y: 270, width: 140, height: 16 },
                    { x: 480, y: 210, width: 120, height: 16 },
                    { x: 680, y: 330, width: 120, height: 50 },
                    { x: 150, y: 160, width: 100, height: 16 }
                ],
                coins: [
                    { x: 350, y: 230, collected: false },
                    { x: 540, y: 170, collected: false },
                    { x: 190, y: 120, collected: false }
                ],
                flag: { x: 730, y: 260, width: 12, height: 70 } // Posição da bandeira na fase 2
            },
            {
                platforms: [
                    { x: 0, y: 330, width: 150, height: 50 },
                    { x: 230, y: 260, width: 90, height: 16 },
                    { x: 380, y: 190, width: 90, height: 16 },
                    { x: 530, y: 260, width: 90, height: 16 },
                    { x: 680, y: 330, width: 120, height: 50 }
                ],
                coins: [
                    { x: 275, y: 220, collected: false },
                    { x: 425, y: 150, collected: false },
                    { x: 575, y: 220, collected: false }
                ],
                flag: { x: 735, y: 260, width: 12, height: 70 } // Posição da bandeira na fase 3
            }
        ];

        let activePlatforms = [];
        let activeCoins = [];
        let activeFlag = null;

        function loadLevel(levelIndex) {
            const levelData = levels[levelIndex];
            activePlatforms = JSON.parse(JSON.stringify(levelData.platforms));
            activeCoins = JSON.parse(JSON.stringify(levelData.coins));
            activeFlag = JSON.parse(JSON.stringify(levelData.flag));
            levelIndicator.textContent = levelIndex + 1;
            mario.x = 50;
            mario.y = 280;
            mario.dy = 0;
            mario.dx = 0;
        }

        function pular() {
            if (isPlaying && mario.grounded) {
                mario.dy = mario.jumpPower;
                mario.grounded = false;
            }
        }

        function handleMainButtonClick() {
            if (gameState === 'START' || gameState === 'GAME_OVER' || gameState === 'VICTORY') {
                // Iniciar do zero
                score = 0;
                currentLevel = 0;
                scoreEl.textContent = score;
                loadLevel(currentLevel);
                overlay.classList.add('hidden');
                startPlaying();
            } else if (gameState === 'LEVEL_COMPLETE') {
                // Avançar para a próxima fase ao clicar em Continuar
                currentLevel++;
                loadLevel(currentLevel);
                overlay.classList.add('hidden');
                startPlaying();
            }
        }

        function startPlaying() {
            const isMobileDevice = window.innerWidth <= 768 || 'ontouchstart' in window;
            if (isMobileDevice) {
                mobileControls.classList.remove('hidden');
                mobileControls.classList.add('flex');
            } else {
                mobileControls.classList.add('hidden');
                mobileControls.classList.remove('flex');
            }
            isPlaying = true;
            gameState = 'PLAYING';
            if (animId) cancelAnimationFrame(animId);
            loop();
        }

        function loop() {
            if (!isPlaying) return;
            ctx.fillStyle = '#38BDF8'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            mario.dy += mario.gravity;
            mario.y += mario.dy;
            mario.x += mario.dx;

            if (mario.x < 0) mario.x = 0;
            if (mario.x + mario.width > canvas.width) mario.x = canvas.width - mario.width;

            mario.grounded = false;
            activePlatforms.forEach(p => {
                if (mario.x < p.x + p.width && mario.x + mario.width > p.x &&
                    mario.y + mario.height >= p.y && mario.y + mario.height <= p.y + p.height + 10 && mario.dy >= 0) {
                    mario.y = p.y - mario.height;
                    mario.dy = 0;
                    mario.grounded = true;
                }
            });

            // Desenhar plataformas
            ctx.fillStyle = '#15803D';
            activePlatforms.forEach(p => ctx.fillRect(p.x, p.y, p.width, p.height));

            // Desenhar Bandeira de Chegada
            if (activeFlag) {
                // Haste da bandeira
                ctx.fillStyle = '#9CA3AF';
                ctx.fillRect(activeFlag.x, activeFlag.y, 4, activeFlag.height);
                // Pano da bandeira
                ctx.fillStyle = '#DC2626';
                ctx.beginPath();
                ctx.moveTo(activeFlag.x + 4, activeFlag.y);
                ctx.lineTo(activeFlag.x + 25, activeFlag.y + 12);
                ctx.lineTo(activeFlag.x + 4, activeFlag.y + 24);
                ctx.fill();

                // Colisão do Mario com a bandeira
                if (mario.x < activeFlag.x + activeFlag.width && mario.x + mario.width > activeFlag.x &&
                    mario.y < activeFlag.y + activeFlag.height && mario.y + mario.height > activeFlag.y) {
                    
                    isPlaying = false;
                    mobileControls.classList.add('hidden');
                    mobileControls.classList.remove('flex');

                    if (currentLevel + 1 < levels.length) {
                        // Passou de fase
                        gameState = 'LEVEL_COMPLETE';
                        overlayTitle.textContent = `Parabéns! Você completou a fase ${currentLevel + 1}`;
                        overlayText.textContent = `Moedas atuais: ${score}. Prepare-se para a próxima fase!`;
                        startBtn.textContent = "Continuar";
                    } else {
                        // Zerou o jogo inteiro!
                        gameState = 'VICTORY';
                        overlayTitle.textContent = "🏆 Você completou todas as fases!";
                        overlayText.textContent = `Parabéns! Pontuação final: ${score} moedas.`;
                        startBtn.textContent = "Jogar Novamente";
                    }
                    overlay.classList.remove('hidden');
                    return;
                }
            }

            // Moedas
            activeCoins.forEach(c => {
                if (!c.collected) {
                    ctx.fillStyle = '#FACC15';
                    ctx.beginPath(); 
                    ctx.arc(c.x, c.y, 9, 0, Math.PI * 2); 
                    ctx.fill();

                    if (mario.x < c.x + 10 && mario.x + mario.width > c.x - 10 && mario.y < c.y + 10 && mario.y + mario.height > c.y - 10) {
                        c.collected = true; 
                        score += 1; 
                        scoreEl.textContent = score;
                    }
                }
            });

            // Desenhar Mario
            ctx.fillStyle = '#EF4444'; 
            ctx.fillRect(mario.x, mario.y, mario.width, mario.height);

            // Game Over se cair no abismo
            if (mario.y > canvas.height) {
                isPlaying = false;
                gameState = 'GAME_OVER';
                mobileControls.classList.add('hidden');
                mobileControls.classList.remove('flex');
                overlayTitle.textContent = "Game Over!";
                overlayText.textContent = `Você caiu no abismo na Fase ${currentLevel + 1}! Moedas: ${score}`;
                startBtn.textContent = "Tentar Novamente";
                overlay.classList.remove('hidden');
            } else {
                animId = requestAnimationFrame(loop);
            }
        }

        window.addEventListener('keydown', e => {
            if (!isPlaying) return;
            if (e.key === 'ArrowLeft') mario.dx = -4;
            if (e.key === 'ArrowRight') mario.dx = 4;
            if (e.key === ' ') {
                e.preventDefault();
                pular();
            }
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' && mario.dx < 0) mario.dx = 0;
            if (e.key === 'ArrowRight' && mario.dx > 0) mario.dx = 0;
        });

        function setupPointerButton(id, onDown, onUp) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('pointerdown', (e) => { e.preventDefault(); onDown(); });
            el.addEventListener('pointerup', (e) => { e.preventDefault(); onUp(); });
            el.addEventListener('pointerleave', (e) => { e.preventDefault(); onUp(); });
            el.addEventListener('pointercancel', (e) => { e.preventDefault(); onUp(); });
        }

        setupPointerButton('btnLeft', () => mario.dx = -4, () => { if(mario.dx < 0) mario.dx = 0; });
        setupPointerButton('btnRight', () => mario.dx = 4, () => { if(mario.dx > 0) mario.dx = 0; });

        document.getElementById('btnJump').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            pular();
        });

        const triggerStart = (e) => {
            e.preventDefault();
            handleMainButtonClick();
        };

        startBtn.addEventListener('click', triggerStart);
        startBtn.addEventListener('touchstart', triggerStart, { passive: false });
    </script>
</body>
</html>
