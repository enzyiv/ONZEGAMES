<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man - Meu Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
            <a href="index.html" class="flex items-center text-gray-600 dark:text-gray-300 hover:text-yellow-600 font-medium text-sm">
                <i class="fa-solid fa-arrow-left mr-2"></i> Voltar ao Início
            </a>
            <div class="flex items-center space-x-3">
                <button id="themeToggleBtn" class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                    <i id="themeIcon" class="fa-solid fa-sun text-xl"></i>
                </button>
                <span class="text-sm font-semibold text-gray-700 dark:text-gray-200">Pac-Man</span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 flex flex-col items-center justify-center">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 sm:p-8 w-full text-center">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2 text-yellow-600 dark:text-yellow-400 font-bold text-lg">
                    <i class="fa-solid fa-ghost"></i> Pac-Man
                </div>
                <div class="bg-gray-100 dark:bg-gray-700 px-4 py-1.5 rounded-xl text-sm font-semibold text-gray-800 dark:text-gray-100">
                    Pontos: <span id="score">0</span>
                </div>
            </div>
            <p class="text-gray-600 dark:text-gray-400 text-sm mb-6">Use as **setas do teclado** para guiar o Pac-Man e comer as bolinhas!</p>
            
            <div class="relative w-full flex justify-center bg-gray-900 rounded-2xl overflow-hidden shadow-inner border border-gray-800 p-2">
                <canvas id="gameCanvas" width="400" height="400" class="bg-black rounded-xl max-w-full h-auto shadow-md"></canvas>
                <div id="gameOverlay" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center text-white">
                    <h2 class="text-2xl font-bold mb-2">Pac-Man Clássico</h2>
                    <p class="text-sm text-gray-300 mb-6">Coma todas as pastilhas para vencer!</p>
                    <button id="startBtn" class="px-6 py-3 bg-yellow-600 hover:bg-yellow-700 font-medium rounded-xl shadow-lg transition-all text-black font-bold">Iniciar Jogo</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;
        if (htmlElement.classList.contains('dark')) themeIcon.classList.replace('fa-sun', 'fa-moon');
        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            localStorage.setItem('theme', htmlElement.classList.contains('dark') ? 'dark' : 'light');
            themeIcon.classList.toggle('fa-sun'); themeIcon.classList.toggle('fa-moon');
        });

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('gameOverlay');
        const startBtn = document.getElementById('startBtn');

        let score = 0, isPlaying = false, animId;
        let pacman = { x: 200, y: 200, size: 14, dx: 0, dy: 0, speed: 2 };
        let dots = [];

        function initDots() {
            dots = [];
            for (let x = 30; x < canvas.width; x += 35) {
                for (let y = 30; y < canvas.height; y += 35) {
                    dots.push({ x, y, eaten: false });
                }
            }
        }

        function startGame() {
            score = 0; scoreEl.textContent = score;
            pacman.x = 200; pacman.y = 200; pacman.dx = 0; pacman.dy = 0;
            initDots();
            overlay.classList.add('hidden');
            isPlaying = true;
            loop();
        }

        function loop() {
            if (!isPlaying) return;
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            pacman.x += pacman.dx;
            pacman.y += pacman.dy;

            if (pacman.x < 15) pacman.x = canvas.width - 15;
            if (pacman.x > canvas.width - 15) pacman.x = 15;
            if (pacman.y < 15) pacman.y = canvas.height - 15;
            if (pacman.y > canvas.height - 15) pacman.y = 15;

            // Desenhar Pastilhas
            let remaining = false;
            dots.forEach(d => {
                if (!d.eaten) {
                    remaining = true;
                    ctx.fillStyle = '#FDE047';
                    ctx.beginPath(); ctx.arc(d.x, d.y, 4, 0, Math.PI * 2); ctx.fill();

                    let dist = Math.hypot(pacman.x - d.x, pacman.y - d.y);
                    if (dist < 15) {
                        d.eaten = true; score += 10; scoreEl.textContent = score;
                    }
                }
            });

            // Desenhar Pacman
            ctx.fillStyle = '#EAB308';
            ctx.beginPath(); ctx.arc(pacman.x, pacman.y, pacman.size, 0.2 * Math.PI, 1.8 * Math.PI);
            ctx.lineTo(pacman.x, pacman.y); ctx.fill();

            if (!remaining) {
                isPlaying = false;
                overlay.querySelector('h2').textContent = "Você Venceu!";
                overlay.querySelector('p').textContent = `Pontuação máxima: ${score}`;
                startBtn.textContent = "Jogar Novamente";
                overlay.classList.remove('hidden');
            } else {
                animId = requestAnimationFrame(loop);
            }
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp') { pacman.dx = 0; pacman.dy = -pacman.speed; }
            if (e.key === 'ArrowDown') { pacman.dx = 0; pacman.dy = pacman.speed; }
            if (e.key === 'ArrowLeft') { pacman.dx = -pacman.speed; pacman.dy = 0; }
            if (e.key === 'ArrowRight') { pacman.dx = pacman.speed; pacman.dy = 0; }
        });
        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
