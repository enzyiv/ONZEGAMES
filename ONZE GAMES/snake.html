<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha - Meu Site</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-50 transition-colors duration-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="index.html" class="flex items-center text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors font-medium text-sm">
                    <i class="fa-solid fa-arrow-left mr-2"></i> Voltar ao Início
                </a>
                <div class="flex items-center space-x-3">
                    <button id="themeToggleBtn" class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors focus:outline-none" aria-label="Alternar Tema">
                        <i id="themeIcon" class="fa-solid fa-sun text-xl"></i>
                    </button>
                    <span class="text-sm font-semibold text-gray-700 dark:text-gray-200">Jogo da Cobrinha</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 flex flex-col items-center justify-center">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 sm:p-8 w-full text-center">
            
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2 text-green-600 dark:text-green-400 font-bold text-lg">
                    <i class="fa-solid fa-gamepad"></i> Jogo da Cobrinha
                </div>
                <div class="bg-gray-100 dark:bg-gray-700 px-4 py-1.5 rounded-xl text-sm font-semibold text-gray-800 dark:text-gray-100">
                    Pontos: <span id="score">0</span>
                </div>
            </div>

            <p class="text-gray-600 dark:text-gray-400 text-sm mb-6">Use as **setas do teclado** para controlar a cobrinha e comer a fruta vermelha!</p>
            
            <!-- Área do Jogo (Canvas) -->
            <div class="relative w-full flex justify-center bg-gray-900 rounded-2xl overflow-hidden shadow-inner border border-gray-800 p-2">
                <canvas id="snakeCanvas" width="400" height="400" class="bg-black rounded-xl max-w-full h-auto shadow-md"></canvas>
                
                <!-- Tela de Game Over / Início -->
                <div id="gameOverlay" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center text-white transition-opacity">
                    <h2 id="overlayTitle" class="text-2xl font-bold mb-2">Pronto para jogar?</h2>
                    <p id="overlayText" class="text-sm text-gray-300 mb-6">Pressione a barra de espaço ou clique abaixo para começar</p>
                    <button id="startBtn" class="px-6 py-3 bg-green-600 hover:bg-green-700 font-medium rounded-xl shadow-lg transition-all transform hover:scale-105">
                        Iniciar Jogo
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Script do Jogo -->
    <script>
        // Tema
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;
        if (htmlElement.classList.contains('dark')) themeIcon.classList.replace('fa-sun', 'fa-moon');
        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            } else {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            }
        });

        // Lógica da Cobrinha
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverlay = document.getElementById('gameOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayText = document.getElementById('overlayText');
        const startBtn = document.getElementById('startBtn');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = { x: 5, y: 5 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameInterval = null;
        let isPlaying = false;

        function resetGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            gerarComida();
        }

        function gerarComida() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            // Garante que a comida não apareça em cima da cobrinha
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    gerarComida();
                }
            });
        }

        function startGame() {
            if (isPlaying) return;
            resetGame();
            gameOverlay.style.opacity = '0';
            setTimeout(() => gameOverlay.classList.add('hidden'), 200);
            isPlaying = true;
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 100); // Velocidade da cobrinha (100ms)
        }

        function gameOver() {
            clearInterval(gameInterval);
            isPlaying = false;
            overlayTitle.textContent = "Game Over!";
            overlayText.textContent = `Você fez ${score} pontos. Tente novamente!`;
            startBtn.textContent = "Jogar de Novo";
            gameOverlay.classList.remove('hidden');
            gameOverlay.style.opacity = '1';
        }

        function gameLoop() {
            moverCobrinha();
            if (verificarColisao()) {
                gameOver();
                return;
            }
            desenharCena();
        }

        function moverCobrinha() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // Verifica se comeu a comida
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                gerarComida();
            } else {
                snake.pop(); // Remove a cauda se não comeu
            }
        }

        function verificarColisao() {
            const head = snake[0];
            // Colisão com as paredes
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }
            // Colisão com o próprio corpo
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            return false;
        }

        function desenharCena() {
            // Fundo do tabuleiro
            ctx.fillStyle = "#111827";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenhar Comida (Fruta Vermelha)
            ctx.fillStyle = "#EF4444";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

            // Desenhar Cobrinha
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#10B981" : "#34D399"; // Cabeça mais escura, corpo mais claro
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        // Controle por Teclado
        document.addEventListener('keydown', e => {
            if (!isPlaying) {
                if (e.code === 'Space') startGame();
                return;
            }

            switch (e.key) {
                case 'ArrowUp':
                    if (dy === 0) { dx = 0; dy = -1; }
                    break;
                case 'ArrowDown':
                    if (dy === 0) { dx = 0; dy = 1; }
                    break;
                case 'ArrowLeft':
                    if (dx === 0) { dx = -1; dy = 0; }
                    break;
                case 'ArrowRight':
                    if (dx === 0) { dx = 1; dy = 0; }
                    break;
            }
        });

        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
