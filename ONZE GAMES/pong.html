<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong - Meu Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
            <a href="index.html" class="flex items-center text-gray-600 dark:text-gray-300 hover:text-sky-600 font-medium text-sm">
                <i class="fa-solid fa-arrow-left mr-2"></i> Voltar ao Início
            </a>
            <div class="flex items-center space-x-3">
                <button id="themeToggleBtn" class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                    <i id="themeIcon" class="fa-solid fa-sun text-xl"></i>
                </button>
                <span class="text-sm font-semibold text-gray-700 dark:text-gray-200">Pong</span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 flex flex-col items-center justify-center">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 sm:p-8 w-full text-center">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2 text-sky-600 dark:text-sky-400 font-bold text-lg">
                    <i class="fa-solid fa-table-tennis-paddle-ball"></i> Pong Clássico
                </div>
                <div class="bg-gray-100 dark:bg-gray-700 px-4 py-1.5 rounded-xl text-sm font-semibold text-gray-800 dark:text-gray-100">
                    Placar: <span id="score">0 x 0</span>
                </div>
            </div>
            <p class="text-gray-600 dark:text-gray-400 text-sm mb-6">Use as **setas Cima/Baixo** para mover sua raquete e rebater a bola!</p>
            
            <div class="relative w-full flex justify-center bg-gray-900 rounded-2xl overflow-hidden shadow-inner border border-gray-800 p-2">
                <canvas id="gameCanvas" width="480" height="300" class="bg-black rounded-xl max-w-full h-auto shadow-md"></canvas>
                <div id="gameOverlay" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center text-white">
                    <h2 class="text-2xl font-bold mb-2">Pong Retrô</h2>
                    <p class="text-sm text-gray-300 mb-6">Vença o adversário pontuando mais!</p>
                    <button id="startBtn" class="px-6 py-3 bg-sky-600 hover:bg-sky-700 font-medium rounded-xl shadow-lg transition-all">Iniciar Jogo</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;
        if (htmlElement.classList.contains('dark')) themeIcon.classList.replace('fa-sun', 'fa-moon');
        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            localStorage.setItem('theme', htmlElement.classList.contains('dark') ? 'dark' : 'light');
            themeIcon.classList.toggle('fa-sun'); themeIcon.classList.toggle('fa-moon');
        });

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('gameOverlay');
        const startBtn = document.getElementById('startBtn');

        let pScore = 0, aiScore = 0, isPlaying = false, animId;
        let player = { x: 15, y: 110, width: 10, height: 70, dy: 0 };
        let ai = { x: 455, y: 110, width: 10, height: 70, speed: 3.5 };
        let ball = { x: 240, y: 150, radius: 8, dx: 3, dy: 3 };

        function startGame() {
            pScore = 0; aiScore = 0; scoreEl.textContent = "0 x 0";
            ball.x = 240; ball.y = 150; ball.dx = 3; ball.dy = 3;
            overlay.classList.add('hidden');
            isPlaying = true;
            loop();
        }

        function loop() {
            if (!isPlaying) return;
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Mover Player
            player.y += player.dy;
            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) player.y = canvas.height - player.height;

            // IA Simples
            if (ai.y + ai.height / 2 < ball.y) ai.y += ai.speed;
            else if (ai.y + ai.height / 2 > ball.y) ai.y -= ai.speed;

            // Mover Bola
            ball.x += ball.dx;
            ball.y += ball.dy;

            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) ball.dy *= -1;

            // Colisão Raquete Player
            if (ball.x - ball.radius < player.x + player.width && ball.y > player.y && ball.y < player.y + player.height) {
                ball.dx *= -1;
            }
            // Colisão Raquete IA
            if (ball.x + ball.radius > ai.x && ball.y > ai.y && ball.y < ai.y + ai.height) {
                ball.dx *= -1;
            }

            // Pontuação
            if (ball.x < 0) { aiScore++; scoreEl.textContent = `${pScore} x ${aiScore}`; resetBall(); }
            if (ball.x > canvas.width) { pScore++; scoreEl.textContent = `${pScore} x ${aiScore}`; resetBall(); }

            // Desenhar Raquetes e Bola
            ctx.fillStyle = '#0EA5E9';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillRect(ai.x, ai.y, ai.width, ai.height);

            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fill();

            animId = requestAnimationFrame(loop);
        }

        function resetBall() {
            ball.x = canvas.width / 2; ball.y = canvas.height / 2;
            ball.dx *= -1;
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp') player.dy = -5;
            if (e.key === 'ArrowDown') player.dy = 5;
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') player.dy = 0;
        });
        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
