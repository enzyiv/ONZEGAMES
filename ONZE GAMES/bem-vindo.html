<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo - Meu Site</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- Script preventivo para aplicar o tema antes de carregar a página -->
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <!-- FontAwesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-50 transition-colors duration-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="perfil.html" class="flex items-center text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors font-medium text-sm">
                    <i class="fa-solid fa-arrow-left mr-2"></i> Voltar
                </a>
                <div class="flex items-center space-x-3">
                    <button id="themeToggleBtn" class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500" aria-label="Alternar Tema">
                        <i id="themeIcon" class="fa-solid fa-sun text-xl"></i>
                    </button>
                    <span class="text-sm font-semibold text-gray-700 dark:text-gray-200">Exploração</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12">
        <div class="max-w-lg w-full bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-8 sm:p-10 border border-gray-100 dark:border-gray-700 text-center transition-colors duration-200">
            
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-50 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 mb-6 shadow-sm">
                <i class="fa-solid fa-rocket text-2xl"></i>
            </div>

            <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 dark:text-gray-100 mb-4">
                Apenas mais alguns cliques para entrar nos jogos!!!
            </h1>

            <p class="text-gray-600 dark:text-gray-400 text-base leading-relaxed mb-8">
                Aproveite!!!!
            </p>

            <a href="index.html" class="w-full inline-block py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-sm transition-colors text-center focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                Entrar <i class="fa-solid fa-arrow-right ml-2"></i>
            </a>

        </div>
    </main>

    <script>
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;

        if (htmlElement.classList.contains('dark')) {
            themeIcon.classList.replace('fa-sun', 'fa-moon');
        }

        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            } else {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            }
        });
    </script>
</body>
</html>
